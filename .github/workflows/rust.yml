name: Rust

on:
  push:
    branches: [ "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libdbus-1-dev packagekit
      - name: Install Rust
        run: |
          rustup update stable
          rustup default stable
          rustup component add rustfmt clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run clippy
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo clippy --all-targets --features nagios -- -D warnings

  test:
    name: Test
    needs: check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust: [stable, beta]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ matrix.rust }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libdbus-1-dev packagekit
      - name: Install Rust
        run: |
          rustup update ${{ matrix.rust }}
          rustup default ${{ matrix.rust }}
      - name: Build
        run: |
          cargo build --verbose
          cargo build --verbose --features nagios
      - name: Run tests
        run: |
          cargo test --verbose
          cargo test --verbose --features nagios

  build:
    name: Build Linux (${{ matrix.variant }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - variant: standard
            features: ""
            suffix: ""
          - variant: nagios
            features: "nagios"
            suffix: "-nagios"
    env:
      # Static musl binary: no glibc version requirement, runs on Debian 12 and older/newer distributions
      TARGET: x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-musl-${{ matrix.variant }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Install Rust
        run: |
          rustup update stable
          rustup default stable
          rustup target add $TARGET
      - name: Build release
        run: cargo build --release --verbose --target $TARGET --features "${{ matrix.features }}"
      - name: Package
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="${GITHUB_SHA::7}"
          fi
          NAME="check_updates${{ matrix.suffix }}-${VERSION}-linux-x86_64"
          mkdir dist
          cp "target/$TARGET/release/check_updates" "dist/$NAME"
          tar -czvf "dist/$NAME.tar.gz" -C "target/$TARGET/release" check_updates
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: check_updates-${{ matrix.variant }}
          path: dist/

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Get version
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV
      - name: Download Linux binaries
        uses: actions/download-artifact@v8
        with:
          pattern: check_updates-*
          path: dist/
          merge-multiple: true
      - name: Make executable
        run: chmod +x dist/*-linux-x86_64
      - name: Extract changelog
        id: changelog
        run: |
          if [ -f CHANGELOG.md ]; then
            # Extract content between the latest version header and the next version header
            CHANGELOG=$(awk "/^## \[${{ env.VERSION }}\]/ {flag=1;next} /^## \[/ {flag=0} flag" CHANGELOG.md | tr -d '\r')
            if [ -z "$CHANGELOG" ]; then
              CHANGELOG="Release version ${{ env.VERSION }}"
            fi
            echo "CHANGELOG<<EOF" >> $GITHUB_ENV
            echo "$CHANGELOG" >> $GITHUB_ENV
            echo "EOF" >> $GITHUB_ENV
          else
            echo "CHANGELOG=Release version ${{ env.VERSION }}" >> $GITHUB_ENV
          fi
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          body: ${{ env.CHANGELOG }}
          draft: false
          prerelease: false
